<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>動漫人物・踩地雷</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#171717}
.wrap{max-width:760px;margin:auto;padding:20px 16px 36px}h1{text-align:center;margin:8px 0 4px}
.sub{text-align:center;color:#666;margin:0 0 18px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 18px #0001;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:center}.timer{font-size:28px;font-weight:800}
.topic{font-size:34px;font-weight:800;text-align:center;margin:28px 0}
input,select{width:100%;padding:14px;border:1px solid #ccc;border-radius:12px;font-size:18px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#171717;color:#fff;font-size:17px;font-weight:700;margin-top:10px}
button.secondary{background:#e9e9ed;color:#171717}.result{text-align:center;min-height:28px;font-size:20px;font-weight:800;margin-top:12px}
.progress{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}.dot{height:8px;border-radius:8px;background:#ddd}.dot.done{background:#171717}
.hidden{display:none}.score{text-align:center;font-size:18px;font-weight:700}.hint{font-size:14px;color:#666;line-height:1.5}
@media(max-width:520px){.topic{font-size:29px}.timer{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🎮 動漫人物・踩地雷</h1>
<p class="sub">每場 10 題・每題 30 秒・每題獨立地雷</p>

<div id="start" class="card">
  <div class="hint">角色資料庫會依「作品、題目標籤、別名、聲優」判定答案。遇到同名角色會先確認作品。</div>
  <button onclick="startGame()">開始遊戲</button>
</div>

<div id="game" class="hidden">
<div class="card">
<div class="top"><b id="qnum"></b><span class="timer" id="timer">30</span></div>
<div class="progress" id="progress"></div>
<div class="topic" id="topic"></div>
<input id="answer" placeholder="輸入動漫角色名稱" autocomplete="off">
<div id="workBox" class="hidden">
  <p class="hint">找到同名角色，請選擇作品：</p>
  <select id="workSelect"></select>
</div>
<button onclick="submitAnswer()">送出答案</button>
<div class="result" id="result"></div>
</div>
</div>

<div id="end" class="card hidden">
<div class="score" id="score"></div><button onclick="startGame()">再玩一場</button>
</div>
</div>

<script>
const TOPICS = ["老師","醫生","軍人","魔法師","單手劍士","雙手劍士","刺客","勇者","死靈術師","海賊","忍者","死神","轉生者","穿越者","最終Boss","大型機器人駕駛員","皇帝（國王）","主唱","吉他手","鼓手","DJ","廚師","鍊金術師","上班族","人魚","妖精","惡魔","殭屍","吸血鬼","機器人","巨人","外星人","天使","哥布林（巨魔）","鬼","幽靈","骷髏","精靈","籃球","排球","足球","網球","游泳","棒球","各種顏色的頭髮","眼鏡","笨蛋","天才","獨眼","可愛生物","異色瞳","獸耳","翅膀","眼罩","面具","雙馬尾","傲嬌","腹黑","中二","無口","超能力","變身","狗","貓","馬","龍","狼","宇航員（太空人）","手槍","牛仔","埃及","義大利","偶像","科學家","替身使者","決鬥者","魔法少女","子安武人","武士","火","水","雷","蛇","弓箭手","騎士","巫女","偵探","反派","王子","怪獸"];
let DB=[],game=[],idx=0,safe=0,mine=0,fail=0,timer=30,tick=null,locked=false;

async function loadDB(){
  const r=await fetch("anime-minesweeper-characters.json");
  DB=(await r.json()).characters||[];
}
function sample(a,n){let x=[...a],o=[];while(x.length&&o.length<n)o.push(x.splice(Math.floor(Math.random()*x.length),1)[0]);return o}
function startGame(){
  clearInterval(tick);idx=0;safe=0;mine=0;fail=0;
  game=sample(TOPICS,10).map(topic=>{
    const pool=DB.filter(c=>c.topics.includes(topic));
    const m=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
    return {topic,mine:m};
  });
  document.getElementById("start").classList.add("hidden");
  document.getElementById("end").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");render();
}
function render(){
  clearInterval(tick);locked=false;timer=30;
  const q=game[idx];document.getElementById("qnum").textContent=`第 ${idx+1} 題 / 10`;
  document.getElementById("timer").textContent=timer;document.getElementById("topic").textContent=q.topic;
  document.getElementById("answer").value="";document.getElementById("result").textContent="";
  document.getElementById("workBox").classList.add("hidden");
  document.getElementById("progress").innerHTML=game.map((_,i)=>`<span class="dot ${i<idx?"done":""}"></span>`).join("");
  document.getElementById("answer").focus();
  tick=setInterval(()=>{timer--;document.getElementById("timer").textContent=timer;if(timer<=0){clearInterval(tick);failQ("⏰ 時間到！")}},1000);
}
function norm(s){return s.trim().toLowerCase().replace(/\s+/g,"")}
function candidates(ans){
  const a=norm(ans);
  return DB.filter(c=>norm(c.name)===a || c.aliases.some(x=>norm(x)===a));
}
function failQ(msg){if(locked)return;locked=true;fail++;clearInterval(tick);document.getElementById("result").textContent=msg;setTimeout(next,700)}
function submitAnswer(){
  if(locked)return;
  const ans=document.getElementById("answer").value.trim();if(!ans){failQ("💥 放棄／未作答");return}
  const cs=candidates(ans);
  if(!cs.length){failQ("❓ 資料庫找不到這名角色");return}
  if(cs.length>1 && document.getElementById("workBox").classList.contains("hidden")){
    const sel=document.getElementById("workSelect");sel.innerHTML=cs.map((c,i)=>`<option value="${i}">${c.work}｜${c.name}</option>`).join("");
    document.getElementById("workBox").classList.remove("hidden");window._candidates=cs;return;
  }
  const c=cs.length>1?window._candidates[+document.getElementById("workSelect").value]:cs[0];
  const q=game[idx];
  if(q.mine && c.name===q.mine.name && c.work===q.mine.work){locked=true;mine++;clearInterval(tick);document.getElementById("result").textContent="💥 踩雷！";setTimeout(next,700);return}
  let ok=false;
  if(q.topic==="子安武人") ok=c.voice_actor.includes("子安武人");
  else if(q.topic==="各種顏色的頭髮") ok=!!c.hair_color && !["黑色","黑"].includes(c.hair_color);
  else ok=c.topics.includes(q.topic);
  if(!ok){failQ("💥 題目不符！");return}
  locked=true;safe++;clearInterval(tick);document.getElementById("result").textContent="✅ 安全！";setTimeout(next,700);
}
function next(){if(idx<9){idx++;render()}else finish()}
function finish(){document.getElementById("game").classList.add("hidden");document.getElementById("end").classList.remove("hidden");document.getElementById("score").textContent=`本場：安全 ${safe} 題・踩雷 ${mine} 題・題目不符／未作答 ${fail} 題`}
</script>
</body></html>

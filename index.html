const norm=s=>(s||'').toString().trim().toLowerCase().replace(/\s+/g,'').replace(/[・·•'’'`]/g,'');
function key(c){return norm(c.name)+'|'+norm(c.work)}
function addUnique(arr,c){if(!c||!c.name)return;let k=key(c);let old=arr.find(x=>key(x)===k);if(old){old.aliases=[...new Set([...(old.aliases||[]),...(c.aliases||[])])];old.topics=[...new Set([...(old.topics||[]),...(c.topics||[])])];if(c.voice_actor)old.voice_actor=old.voice_actor||c.voice_actor;return}arr.push(c)}
function flattenRemote(db){const out=[];for(const c of (db.data||[])){const base={name:c.name||'',work:'',topics:[],aliases:[...(c.nicknames||[])],voice_actor:'',about:c.about||'',kanji:c.name_kanji||'',mal_id:c.mal_id};const va=((c.voiceActorsByLanguage||{}).Japanese||[]);if(va[0])base.voice_actor=va[0].person?.name||va[0].name||'';const apps=Array.isArray(c.animeAppearances)?c.animeAppearances:[];if(!apps.length){out.push(base);continue}for(const a of apps){const w=a?.anime?.title||a?.anime?.name||'';out.push({...base,work:w,role:a.role||''})}}return out}
function buildIndex(remote){const merged=[...SEED.characters];for(const c of flattenRemote(remote))addUnique(merged,c);return merged}
function searchable(c){return [c.name,c.kanji,c.work,...(c.aliases||[])].filter(Boolean).join('|')}
function topicByHeuristic(c,t){
 if(t==='子安武人'||t==='釘宮理惠'||t==='石田彰') return (c.voice_actor||'').includes(t);
 if(t==='各種顏色的頭髮') return !!c.hair_color&&norm(c.hair_color)!=='黑';
 if((c.topics||[]).includes(t)) return true;
 const s=(searchable(c)+' '+(c.about||'')).toLowerCase();
 const rules={
  '殺手':['assassin','killer','hitman','murderer','暗殺','殺し屋','刺客'], '超能力':['psychic','esper','telekinesis','superpower','supernatural','psychic power','超能力','異能','念力'], '冰':['ice','frost','snow','cryo','氷','冰'],
  '武士':['samurai','ronin','shogun','侍','浪人'], '忍者':['ninja','shinobi','忍者','忍'], '弓箭手':['archer','archery','弓箭','弓使'], '騎士':['knight','騎士','paladin'], '巫女':['miko','巫女'], '偵探':['detective','detective','偵探'], '反派':['villain','antagonist','evil','反派'], '王子':['prince','王子'], '皇帝（國王）':['emperor','king','queen','empress','國王','皇帝','女王'], '醫生':['doctor','physician','surgeon','醫師','醫生'], '老師':['teacher','professor','sensei','教師','老師'], '軍人':['soldier','military','army','captain','軍人','士兵'], '魔法師':['mage','wizard','witch','sorcerer','magician','魔法師'], '勇者':['hero','brave','勇者'], '海賊':['pirate','海賊'], '科學家':['scientist','scientist','科學家'], '廚師':['chef','cook','料理','廚師'], '偶像':['idol','偶像'], '主唱':['vocalist','singer','lead singer','主唱'], '吉他手':['guitarist','guitar','吉他'], '鼓手':['drummer','drums','鼓手'], 'DJ':['dj'], '上班族':['salaryman','office worker','employee','上班族'], '天才':['genius','prodigy','天才'], '眼鏡':['glasses','spectacles','眼鏡'], '笨蛋':['idiot','fool','airhead','笨蛋'], '傲嬌':['tsundere','傲嬌'], '腹黑':['sadistic','black-bellied','腹黑'], '中二':['chuunibyou','中二'], '無口':['kuudere','dandere','mute','無口'], '變身':['transform','transformation','變身'], '天使':['angel','天使'], '惡魔':['demon','devil','惡魔'], '吸血鬼':['vampire','吸血鬼'], '殭屍':['zombie','殭屍'], '機器人':['robot','android','機器人'], '巨人':['giant','titan','巨人'], '外星人':['alien','extraterrestrial','外星人'], '鬼':['oni','demon','鬼'], '幽靈':['ghost','spirit','幽靈'], '骷髏':['skeleton','skull','骷髏'], '精靈':['elf','elfen','精靈'], '妖精':['fairy','妖精'], '人魚':['mermaid','人魚'], '龍':['dragon','龍'], '狼':['wolf','狼'], '狗':['dog','canine','狗'], '貓':['cat','feline','貓'], '馬':['horse','馬'], '蛇':['snake','serpent','蛇'], '翅膀':['wing','wings','翅膀'], '眼罩':['eyepatch','blindfold','眼罩'], '面具':['mask','masked','面具'], '雙馬尾':['twintail','twin-tail','雙馬尾'], '獸耳':['animal ears','cat ears','fox ears','獸耳'], '異色瞳':['heterochromia','異色瞳'], '可愛生物':['cute','mascot','可愛'], '獨眼':['one-eyed','cyclops','獨眼'], '魔法少女':['magical girl','mahou shoujo','魔法少女'], '替身使者':['stand user','stand','替身使者'], '決鬥者':['duelist','duel','決鬥者'], '手槍':['pistol','handgun','gun','手槍'], '牛仔':['cowboy','cowgirl','牛仔'], '埃及':['egypt','egyptian','埃及'], '義大利':['italy','italian','義大利'], '宇航員（太空人）':['astronaut','cosmonaut','宇航員','太空人'], '大型機器人駕駛員':['mecha pilot','mobile suit pilot','pilot','機器人駕駛'], '轉生者':['reincarnated','reincarnation','轉生'], '穿越者':['isekai','transported to another world','穿越'], '死神':['grim reaper','shinigami','死神'], '死靈術師':['necromancer','necromancy','死靈術'], '最終Boss':['final boss','boss','魔王','final enemy'], '火':['fire','flame','炎','火'], '水':['water','aqua','水'], '雷':['thunder','lightning','雷'], '精靈':['elf','spirit','精靈']
 };
 const arr=rules[t]||[];return arr.some(x=>s.includes(x.toLowerCase()));
}
function valid(c,t){return topicByHeuristic(c,t)}
function candidates(input){const n=norm(input);if(!n)return [];return CHARACTERS.filter(c=>norm(c.name)===n||(c.aliases||[]).some(a=>norm(a)===n)||(norm(c.kanji)===n&&n))}
function sameChar(a,b){return a&&b&&((a.mal_id&&b.mal_id&&a.mal_id===b.mal_id)||(norm(a.name)===norm(b.name)&&norm(a.work)===norm(b.work)))}
function pickTopic(){const p=TOPICS.filter(t=>!gameTopics.includes(t));return p[Math.floor(Math.random()*p.length)]}
function mineFor(t){let p=CHARACTERS.filter(c=>valid(c,t));return p.length?p[Math.floor(Math.random()*p.length)]:null}
function start(){gameTopics=[];mines=[];q=0;safe=0;boom=0;mismatch=0;history=[];for(let i=0;i<TOTAL;i++){let t=pickTopic();gameTopics.push(t);mines.push(mineFor(t))}$('start').classList.add('hidden');$('summary').classList.add('hidden');$('game').classList.remove('hidden');render()}
function render(){locked=false;left=SECONDS;$('count').textContent=`第 ${q+1} / ${TOTAL} 題`;$('topic').textContent=gameTopics[q];$('time').textContent=`${left} 秒`;$('bar').style.width='100%';$('answer').value='';$('result').textContent='';$('result').className='result';$('workBox').classList.add('hidden');$('workBox').dataset.ready='';$('nextBox').classList.add('hidden');$('submitBtn').disabled=false;$('giveUpBtn').disabled=false;clearInterval(timer);timer=setInterval(()=>{left--;$('time').textContent=`${left} 秒`;$('bar').style.width=`${Math.max(0,left/SECONDS*100)}%`;if(left<=0){clearInterval(timer);finish('timeout')}},1000);setTimeout(()=>$('answer').focus(),80)}
function finish(mode,char){if(locked)return;locked=true;clearInterval(timer);$('submitBtn').disabled=true;$('giveUpBtn').disabled=true;let t=gameTopics[q],m=mines[q],text,cls;if(mode==='timeout'){boom++;text='⏰ 時間到！';cls='boom'}else if(mode==='giveup'){boom++;text='🏳️ 放棄，本題失敗';cls='boom'}else if(!char||!valid(char,t)){mismatch++;text='💥 題目不符';cls='boom'}else if(sameChar(char,m)){boom++;text='💥 踩雷！';cls='boom'}else{safe++;text='✅ 安全！';cls='safe'}history.push({topic:t,answer:char?`${char.name}｜${char.work||'未知作品'}`:'—',result:text});$('result').textContent=text;$('result').className=`result ${cls}`;$('nextBox').classList.remove('hidden')}
function submit(){let cs=candidates($('answer').value);if(!cs.length){$('result').textContent='🔎 大型資料庫也找不到這個名稱，請確認角色名稱或再試一次。';$('result').className='result boom';return}if(cs.length>1){$('work').innerHTML=cs.map((c,i)=>`<option value="${i}">${c.work||'作品未記載'}｜${c.name}</option>`).join('');$('workBox').classList.remove('hidden');if($('workBox').dataset.ready==='1')finish('answer',cs[+$('work').value]);else{$('workBox').dataset.ready='1';$('result').textContent='請選擇作品後，再按一次「確認答案」';$('result').className='result'}}else finish('answer',cs[0])}
function next(){if(q<TOTAL-1){q++;render()}else end()}function end(){$('game').classList.add('hidden');$('summary').classList.remove('hidden');$('score').innerHTML=`安全 <b>${safe}</b>　踩雷/失敗 <b>${boom}</b>　題目不符 <b>${mismatch}</b>`;$('history').innerHTML=history.map((h,i)=>`<div class="mini"><b>${i+1}. ${h.topic}</b><br>${h.answer}　${h.result}</div>`).join('')}
async function loadRemote(){
 $('loadStatus').textContent='正在載入大型公開角色索引…';
 for(const url of REMOTE_URLS){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)continue;const db=await r.json();if(!Array.isArray(db.data)||db.data.length<100)continue;CHARACTERS=buildIndex(db);$('dbCount').textContent=`${CHARACTERS.length.toLocaleString()} 個角色索引`;$('dbStatus').textContent=`大型資料庫已載入：${CHARACTERS.length.toLocaleString()} 個角色索引（本機核心 ${SEED.characters.length} 個）。`;$('loadStatus').textContent='大型資料庫已就緒，可以開始遊戲。';$('loadStatus').className='status ok';$('startBtn').disabled=false;$('startBtn').textContent='開始遊戲';return}catch(e){}}
$('dbCount').textContent=`${CHARACTERS.length} 個核心角色`;$('loadStatus').textContent='大型公開索引暫時無法連線；仍可使用核心角色資料庫。';$('loadStatus').className='status warn';$('startBtn').disabled=false;$('startBtn').textContent='使用核心資料庫開始';
}
$('startBtn').onclick=start;$('againBtn').onclick=start;$('submitBtn').onclick=submit;$('giveUpBtn').onclick=()=>finish('giveup');$('nextBtn').onclick=next;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!locked)submit()});loadRemote();
</script></body></html>

<style>

*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b1020,#11182a);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:auto;padding:18px 14px 40px}.hero{padding:12px 4px 18px}.title{font-size:30px;font-weight:900}.sub{color:var(--muted);margin-top:6px}
.card{background:rgba(20,27,45,.96);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 12px 35px #0005}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.pill{padding:7px 10px;border-radius:999px;background:var(--card2);color:var(--muted);font-size:13px}
.topic{font-size:38px;font-weight:900;margin:8px 0 4px}.prompt{color:var(--muted);line-height:1.6}
.timer{height:9px;background:#26314d;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;background:var(--accent);width:100%;transition:width .2s linear}
input,select{width:100%;padding:14px;border-radius:13px;border:1px solid var(--line);background:#0d1425;color:var(--text);font-size:17px;margin-top:10px}
button{border:0;border-radius:13px;padding:13px 17px;font-size:16px;font-weight:800;background:var(--accent);color:white;cursor:pointer}
button.secondary{background:#27334f}button:disabled{opacity:.45}
.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1}
.result{font-size:20px;font-weight:900;margin-top:15px}.safe{color:var(--ok)}.boom{color:var(--danger)}
.hidden{display:none!important}.list{display:grid;gap:8px}.mini{font-size:14px;color:var(--muted);padding:8px 0;border-bottom:1px solid var(--line)}
footer{color:#75809a;font-size:12px;text-align:center;padding:20px}
</style>
</head>

<button id="startBtn">開始遊戲</button>
</section>

<div id="result" class="result"></div><div id="nextBox" class="actions hidden"><button id="nextBtn">下一題</button></div>
</section>
<section id="summary" class="card hidden">
<div class="topic">遊戲結束</div><div id="score" class="prompt"></div><div id="history" class="list"></div>
<button id="againBtn" style="margin-top:12px">再玩一局</button>
</section>
<section class="card"><div class="row"><strong>角色資料庫</strong><span class="pill" id="dbCount"></span></div>

<footer>動漫人物・踩地雷 v4</footer>

function render(){locked=false;left=SECONDS;$("count").textContent=`第 ${q+1} / ${TOTAL} 題`;$("topic").textContent=gameTopics[q];$("time").textContent=`${left} 秒`;$("bar").style.width="100%";$("answer").value="";$("result").textContent="";$("result").className="result";$("workBox").classList.add("hidden");$("workBox").dataset.ready="";$("nextBox").classList.add("hidden");$("submitBtn").disabled=false;$("giveUpBtn").disabled=false;clearInterval(timer);timer=setInterval(()=>{left--;$("time").textContent=`${left} 秒`;$("bar").style.width=`${Math.max(0,left/SECONDS*100)}%`;if(left<=0){clearInterval(timer);finish("timeout")}},1000);setTimeout(()=>$("answer").focus(),80)}
function finish(mode,char){if(locked)return;locked=true;clearInterval(timer);$("submitBtn").disabled=true;$("giveUpBtn").disabled=true;let t=gameTopics[q],m=mines[q],text,cls;if(mode==="timeout"){boom++;text="⏰ 時間到！";cls="boom"}else if(mode==="giveup"){boom++;text="🏳️ 放棄，本題失敗";cls="boom"}else if(!char||!valid(char,t)){mismatch++;text="💥 題目不符";cls="boom"}else if(sameChar(char,m)){boom++;text="💥 踩雷！";cls="boom"}else{safe++;text="✅ 安全！";cls="safe"}history.push({topic:t,answer:char?`${char.name}｜${char.work}`:"—",result:text});$("result").textContent=text;$("result").className=`result ${cls}`;$("nextBox").classList.remove("hidden")}
function submit(){let cs=candidates($("answer").value);if(!cs.length){$("result").textContent="🔎 資料庫沒有這個角色。這個版本不會再嘗試讀取外部 JSON。";$("result").className="result boom";return}if(cs.length>1){$("work").innerHTML=cs.map((c,i)=>`<option value="${i}">${c.work}｜${c.name}</option>`).join("");$("workBox").classList.remove("hidden");if($("workBox").dataset.ready==="1"){finish("answer",cs[+$("work").value])}else{$("workBox").dataset.ready="1";$("result").textContent="請選擇作品後，再按一次「確認答案」";$("result").className="result"}}else finish("answer",cs[0])}
function next(){if(q<TOTAL-1){q++;render()}else end()}
function end(){$("game").classList.add("hidden");$("summary").classList.remove("hidden");$("score").innerHTML=`安全 <b>${safe}</b>　踩雷/失敗 <b>${boom}</b>　題目不符 <b>${mismatch}</b>`;$("history").innerHTML=history.map((h,i)=>`<div class="mini"><b>${i+1}. ${h.topic}</b><br>${h.answer}　${h.result}</div>`).join("")}
$("startBtn").onclick=start;$("againBtn").onclick=start;$("submitBtn").onclick=submit;$("giveUpBtn").onclick=()=>finish("giveup");$("nextBtn").onclick=next;$("answer").addEventListener("keydown",e=>{if(e.key==="Enter"&&!locked)submit()});
</script>
</body></html>

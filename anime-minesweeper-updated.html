<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>動漫人物・踩地雷</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
*{box-sizing:border-box} body{margin:0;background:#f5f5f7;color:#171717}
.wrap{max-width:760px;margin:auto;padding:20px 16px 36px}
h1{text-align:center;margin:8px 0 4px}.sub{text-align:center;color:#666;margin:0 0 18px}
.card{background:white;border-radius:18px;padding:18px;box-shadow:0 4px 18px #00000010;margin-bottom:14px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.badge{font-weight:700}.timer{font-size:28px;font-weight:800}
.topic{font-size:34px;font-weight:800;text-align:center;margin:28px 0}
input{width:100%;padding:14px;border:1px solid #ccc;border-radius:12px;font-size:18px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#171717;color:#fff;font-size:17px;font-weight:700;margin-top:10px}
button.secondary{background:#e9e9ed;color:#171717}
.result{min-height:28px;text-align:center;font-size:20px;font-weight:800;margin-top:12px}
.progress{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}
.dot{height:8px;border-radius:8px;background:#ddd}.dot.done{background:#171717}.dot.mine{background:#777}
.rules{color:#555;line-height:1.65;font-size:14px}
.hidden{display:none}.score{text-align:center;font-size:18px;font-weight:700}
@media(max-width:520px){.topic{font-size:29px}.timer{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 動漫人物・踩地雷</h1>
  <p class="sub">每場 10 題・每題 30 秒・每題獨立地雷</p>

  <div id="startCard" class="card">
    <button onclick="startGame()">開始遊戲</button>
    <button class="secondary" onclick="showRules()">遊戲規則</button>
  </div>

  <div id="game" class="hidden">
    <div class="card">
      <div class="top"><div class="badge" id="qnum"></div><div class="timer" id="timer">30</div></div>
      <div class="progress" id="progress"></div>
      <div class="topic" id="topic"></div>
      <input id="answer" autocomplete="off" placeholder="輸入動漫角色名稱">
      <button onclick="submitAnswer()">送出答案</button>
      <div class="result" id="result"></div>
    </div>
  </div>

  <div id="end" class="card hidden">
    <div class="score" id="score"></div>
    <button onclick="startGame()">再玩一場</button>
  </div>

  <div id="rules" class="card hidden rules">
    <b>規則</b><br>
    1. 每場隨機抽 10 個不同題目。<br>
    2. 每題都有獨立的隱藏地雷角色。<br>
    3. 答案符合題目且不是該題地雷 → 安全。<br>
    4. 答案正好是該題地雷 → 💥踩雷。<br>
    5. 不符合題目或放棄 → 題目不符／失敗。<br>
    6. 踩雷不會結束遊戲，繼續完成 10 題。<br>
    7. 同名角色無法判定時，遊戲會提示確認作品名稱。
  </div>
</div>

<script>
const TOPICS = [
"老師","醫生","軍人","魔法師","單手劍士","雙手劍士","刺客","勇者","死靈術師","海賊","忍者","死神","轉生者","穿越者","最終Boss","大型機器人駕駛員","皇帝（國王）","主唱","吉他手","鼓手","DJ","廚師","鍊金術師","上班族",
"人魚","妖精","惡魔","殭屍","吸血鬼","機器人","巨人","外星人","天使","哥布林（巨魔）","鬼","幽靈","骷髏","精靈",
"籃球","排球","足球","網球","游泳","棒球",
"各種顏色的頭髮","眼鏡","笨蛋","天才","獨眼","可愛生物","異色瞳","獸耳","翅膀","眼罩","面具","雙馬尾","傲嬌","腹黑","中二","無口","超能力","變身",
"狗","貓","馬","龍","狼",
"宇航員（太空人）","手槍","牛仔","埃及","義大利","偶像","科學家","替身使者","決鬥者","魔法少女","子安武人","武士","火","水","雷","蛇","弓箭手","騎士","巫女","偵探","反派","王子","怪獸"
];

// 示範地雷資料：正式版可直接替換/擴充。
// 每題仍會從該題的地雷池隨機選一名角色。
const MINES = {
"武士":["桂小太郎","坂本龍馬","土方十四郎"],
"天才":["出木杉英才","石神千空","L"],
"手槍":["吉良吉影","米斯達","次元大介"],
"科學家":["石神千空","阿笠博士","布爾瑪"],
"忍者":["波風水門","漩渦鳴人","旗木卡卡西"],
"狗":["定春","犬夜叉","帕克"],
"外星人":["Keroro軍曹","拉姆","長門有希"],
"吸血鬼":["DIO","忍野忍","阿卡多"],
"偵探":["工藤新一","江戶川柯南","L"],
"巫女":["桔梗","博麗靈夢","東風谷早苗"],
"龍":["神龍","康娜","小可"],
"精靈":["艾蜜莉亞","亞絲娜","高等精靈弓手"],
"面具":["七星靜香","小丑","假面騎士"],
"翅膀":["加百列","拉菲爾","天使"],
"老師":["五條悟","殺老師","蔚藍檔案的老師"]
};

let game=[], idx=0, safe=0, minesHit=0, failed=0, timer=30, tick=null, locked=false;

function sample(arr,n){
  const a=[...arr]; const out=[];
  while(a.length && out.length<n) out.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);
  return out;
}
function startGame(){
  clearInterval(tick); locked=false; idx=0; safe=0; minesHit=0; failed=0;
  game=sample(TOPICS,10).map(topic=>({topic,mine:(MINES[topic]||["（示範地雷角色）"])[Math.floor(Math.random()*(MINES[topic]?.length||1))]}));
  document.getElementById("startCard").classList.add("hidden");
  document.getElementById("end").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  render();
}
function render(){
  const q=game[idx]; locked=false; timer=30;
  document.getElementById("qnum").textContent=`第 ${idx+1} 題 / 10`;
  document.getElementById("timer").textContent=timer;
  document.getElementById("topic").textContent=q.topic;
  document.getElementById("answer").value="";
  document.getElementById("answer").focus();
  document.getElementById("result").textContent="";
  document.getElementById("progress").innerHTML=game.map((_,i)=>`<span class="dot ${i<idx?"done":""}"></span>`).join("");
  tick=setInterval(()=>{timer--;document.getElementById("timer").textContent=timer;if(timer<=0){clearInterval(tick);fail("⏰ 時間到！");}},1000);
}
function fail(msg){ if(locked)return; locked=true; failed++; clearInterval(tick); document.getElementById("result").textContent=msg; setTimeout(next,650);}
function submitAnswer(){
  if(locked)return;
  const ans=document.getElementById("answer").value.trim();
  if(!ans){fail("💥 放棄／未作答");return}
  const q=game[idx];
  if(ans===q.mine){locked=true;minesHit++;clearInterval(tick);document.getElementById("result").textContent="💥 踩雷！";setTimeout(next,650);return}
  // 網頁版目前只做「地雷精確比對」；題目是否符合由主持人/玩家判定。
  locked=true;safe++;clearInterval(tick);document.getElementById("result").textContent="✅ 已記錄！";setTimeout(next,650);
}
function next(){
  if(idx<9){idx++;render();}else{finish();}
}
function finish(){
  document.getElementById("game").classList.add("hidden");
  document.getElementById("end").classList.remove("hidden");
  document.getElementById("score").textContent=`本場：安全 ${safe} 題・踩雷 ${minesHit} 題・未作答 ${failed} 題`;
}
function showRules(){document.getElementById("rules").classList.toggle("hidden")}
document.getElementById("answer").addEventListener("keydown",e=>{if(e.key==="Enter")submitAnswer()});
</script>
</body>
</html>
